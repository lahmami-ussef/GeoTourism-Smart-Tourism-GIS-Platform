services:
  db:
    image: postgis/postgis:16-3.5
    container_name: geotourism-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: geotourism
      POSTGRES_USER: geotourism_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - geotourism_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotourism_user -d geotourism"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  geotourism_data: